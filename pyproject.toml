[project]
name = "weekly-log"
version = "0.1.0"
description = "Weekly log CLI: 记录每天学了什么、花了多久"
readme = "README.md"
requires-python = ">=3.12"
dependencies = []

[project.scripts]
weekly-log = "weekly_log.cli:main"

[build-system]
requires = ["uv_build>=0.13.8,<0.14.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.2.0",
    "ruff>=0.17.5",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.ruff.lint.isort]
known-first-party = ["weekly_log"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
